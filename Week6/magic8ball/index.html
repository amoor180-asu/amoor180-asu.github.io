<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Magic 8 Ball</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>🔮 Magic 8 Ball</h1>

    <!-- TEXT INPUT -->
    <input 
      type="text" 
      id="questionInput" 
      placeholder="Ask your question..."
    />

    <!-- INSTRUCTION TEXT -->
    <p id="instruction">
      Type a question, then click the 8 ball
    </p>

    <!-- 8 BALL IMAGE -->
    <img 
      src="Magic_eight_ball.png" 
      alt="Magic 8 Ball"
      id="ball"
    />

    <!-- ANSWER TEXT -->
    <p id="answer">?</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
