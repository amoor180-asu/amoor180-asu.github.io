<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Weather Forecast</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .day {
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 8px;
    }
    .temp {
      font-size: 1.8em;
      margin: 10px 0;
    }
    .high { color: #e74c3c; }
    .low { color: #3498db; }
    .sun {
      margin-top: 10px;
      font-size: 0.95em;
    }
    .error {
      color: red;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🌤 Weekly Weather Forecast</h1>
  <div id="cards"></div>

  <script>
    // Main function to start everything
    async function init() {
      if (!navigator.geolocation) {
        document.getElementById("cards").innerHTML = 
          `<p class="error">Geolocation is not supported by your browser.</p>`;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;
          await fetchWeather(latitude, longitude);
        },
        (error) => {
          let message = "Unable to retrieve your location.";
          if (error.code === 1) message = "Location access denied by user.";
          if (error.code === 2) message = "Location unavailable.";
          if (error.code === 3) message = "Location request timed out.";

          document.getElementById("cards").innerHTML = 
            `<p class="error">${message}<br>Please allow location access and refresh.</p>`;
        }
      );
    }

    // Fetch weather data in FAHRENHEIT
    async function fetchWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&temperature_unit=fahrenheit&timezone=auto`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (!data.daily) throw new Error("No weather data");

        displayWeather(data.daily);
      } catch (err) {
        document.getElementById("cards").innerHTML = 
          `<p class="error">Failed to fetch weather data.</p>`;
        console.error(err);
      }
    }

    // Create and display cards
    function displayWeather(daily) {
      const container = document.getElementById("cards");
      container.innerHTML = "";

      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

      for (let i = 0; i < 7; i++) {
        const date = new Date(daily.time[i]);
        const dayName = days[date.getDay()];

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="day">${dayName}</div>
          <div>${date.toLocaleDateString('en-US', {month:'short', day:'numeric'})}</div>
          
          <div class="temp">
            <span class="high">${Math.round(daily.temperature_2m_max[i])}°F</span> / 
            <span class="low">${Math.round(daily.temperature_2m_min[i])}°F</span>
          </div>
          
          <div class="sun">
            🌅 <strong>${daily.sunrise[i].slice(11)}</strong><br>
            🌇 <strong>${daily.sunset[i].slice(11)}</strong>
          </div>
        `;

        container.appendChild(card);
      }
    }

    // Start the app when page loads
    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
